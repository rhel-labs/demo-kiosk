# AnsibleFest Branding Preset
# To use: cp content/branding/presets/ansiblefest.yaml content/branding/branding.yaml
# NOTE: Download AnsibleFest logo and save to content/branding/logo-ansiblefest.svg

event:
  title: AnsibleFest 2026 - Demo Kiosk
  header: AnsibleFest
  tagline: The premier event for Ansible automation

logos:
  primary:
    file: content/branding/logo-redhat.svg
    alt_text: Red Hat

  secondary:
    file: content/branding/logo-ansiblefest.svg
    alt_text: AnsibleFest

colors:
  # Ansible brand black
  brand_primary: "#000000"
  brand_hover: "#333333"
  page_background: "#f2f2f2"
  header_background: "#000000"

layout:
  card_columns: 3
  idle_timeout_seconds: 30
  countdown_seconds: 10

footer:
  copyright: Red Hat, Inc.
