# Red Hat Summit Branding Preset
# To use: cp content/branding/presets/summit.yaml content/branding/branding.yaml

event:
  title: Red Hat Summit 2026 - Demo Kiosk
  header: Red Hat Summit
  tagline: Navigate what's now. Unlock what's next.

logos:
  primary:
    file: content/branding/logo-redhat.svg
    alt_text: Red Hat

  secondary:
    file: content/branding/logo-summit.svg
    alt_text: Red Hat Summit

colors:
  brand_primary: "#ee0000"
  brand_hover: "#c00000"
  page_background: "#f2f2f2"
  header_background: "#151515"

layout:
  card_columns: 3
  idle_timeout_seconds: 30
  countdown_seconds: 10

footer:
  copyright: Red Hat, Inc.
