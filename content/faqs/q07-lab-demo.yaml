id: q07-lab-demo
order: 70
title: "Try it yourself — hands-on lab"
summary: "Get hands-on experience in a live RHEL environment, no installation required."

demo:
  type: lab
  url: https://zero.rhdp.net/lab/zt-rhelbu.zt-customize-crypto-policy.prod
  long_description: |
    Walk through customizing the cryptographic policy on a live Red Hat Enterprise Linux system.

    You will learn how to:
    - View and change the system-wide crypto policy
    - Apply a custom policy submodule
    - Verify the changes take effect

    A Red Hat account is required to access the lab environment.
  duration: "15 minutes"
