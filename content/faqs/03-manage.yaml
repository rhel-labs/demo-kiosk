id: manage
order: 50
title: "Managing this kiosk"
summary: "The Setup page lets you upload content, manage cards, and update branding."
enabled: true
demo:
  type: external-url
  url: https://github.com/rhel-labs/demo-kiosk
  long_description: |
    Navigate to **/setup** on this kiosk to:
    - Upload a new content bundle (zip) — add mode merges cards, overwrite mode replaces all
    - View and edit currently loaded cards and branding configuration
    - Check whether the content directory is writable

    Use **/display** to control card visibility, display order, and category assignments.

    The kiosk runs as a Quadlet/systemd service — see the repo README for update and restart instructions.
