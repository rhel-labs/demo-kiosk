id: stats-visibility
order: 40
title: "Statistics and card visibility"
summary: "Track which demos visitors engage with and show or hide cards without reloading content."
enabled: true
demo:
  type: external-url
  url: https://github.com/rhel-labs/demo-kiosk
  long_description: |
    Navigate to **/stats** on this kiosk to access the event dashboard.

    **View statistics:**
    - Total card views and average time spent per card
    - Most-viewed card and breakdown by demo type
    - Full timestamped view log, downloadable as CSV

    **Show and hide cards:**
    - Toggle individual cards on or off without uploading new content
    - Changes apply instantly and are stored in the browser
    - Drag rows to reorder the card grid

    Use **/display** to assign cards to categories and reorder the filter tabs.
