name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'author/**'
      - 'scripts/**'
      - 'content/**'
      - 'Containerfile'
      - 'demo-kiosk.container'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: pip install pyyaml yamllint
      - run: python3 scripts/lint-content.py

  build-kiosk:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - name: Build kiosk image
        run: podman build -t demo-kiosk:ci .

      - name: Upload test
        run: IMAGE=demo-kiosk:ci PORT=8181 UPLOAD_ZIP=tests/fixtures/bundles/valid-full-bundle.zip bash tests/test-upload.sh

  build-author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: author
        run: npm ci
      - name: Build
        working-directory: author
        run: npm run build
